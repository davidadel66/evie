# Split one bill evenly in whole cents: a deterministic split, a branch on
# whether cents are left over, and one deterministic step on each path. It
# has no capability, AI, agent, map or interruption step, so manual
# deterministic runs (Stage 14 sub-stage 3) can execute it.
schema_version: 1
name: split-bill
description: Split one bill evenly between people in whole cents.

inputs:
  bill_id:
    type: string
    required: true
    max_length: 64
  total_cents:
    type: integer
    required: true
    minimum: 0
  people:
    # No maximum here: split_evenly@1 itself refuses more than 1000 parts.
    type: integer
    required: true
    minimum: 1

run_key:
  inputs: [bill_id]

limits:
  max_duration: 5m
  max_attempts: 10
  max_parallel: 1
  max_tokens: 1

retention:
  classification: ordinary

start: split

steps:
  - id: split
    kind: deterministic
    function: split_evenly@1
    input:
      total: $inputs.total_cents
      parts: $inputs.people
    retry:
      max_attempts: 3
    next: check

  - id: check
    kind: branch
    cases:
      - when:
          ref: $steps.split.output.remainder
          op: eq
          value: 0
        next: per_person
    default: leftover

  - id: per_person
    kind: deterministic
    description: The amount each person pays when the bill divides exactly.
    function: split_evenly@1
    input:
      total: $steps.split.output.share
      parts: 1

  - id: leftover
    kind: deterministic
    description: The cents left over after an even split, as one amount.
    function: split_evenly@1
    input:
      total: $steps.split.output.remainder
      parts: 1

outputs:
  shares: $steps.split.output.shares
  per_person: $steps.per_person.output.share
  leftover_cents: $steps.leftover.output.share
