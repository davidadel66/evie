<style>
/* Layout: a full-window board you pan and zoom; one process flow left to right; steps open in place. The page shows no code: the map's code references are checked at build time, not drawn */
:root{
  --bg:#F3F4F6; --dot:#D5D9E0; --surface:#FFFFFF; --ink:#111318; --muted:#5F6673; --line:#E1E4EA; --pipe:#C9CED7;

  --mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D0F13; --dot:#262B34; --surface:#161920; --ink:#EDEFF3; --muted:#9AA2AF; --line:#2A2F39; --pipe:#3A414D;
    --pos:#8F9BFF; --neg:#F0A25A; --good:#40CCB0; --mask:#232831;
    --tip-bg:#EDEFF3; --tip-fg:#111318; --tip-muted:#5F6673;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0F13; --dot:#262B34; --surface:#161920; --ink:#EDEFF3; --muted:#9AA2AF; --line:#2A2F39; --pipe:#3A414D;
  --pos:#8F9BFF; --neg:#F0A25A; --good:#40CCB0; --mask:#232831;
  --tip-bg:#EDEFF3; --tip-fg:#111318; --tip-muted:#5F6673;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pos);outline-offset:3px}

.app{height:100%;display:flex;flex-direction:column}
.top{position:relative;z-index:20;display:flex;align-items:center;flex-wrap:wrap;gap:8px 20px;padding:12px 16px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.title{display:flex;flex-direction:column;min-width:0}
.title b{font-size:15px;font-weight:600;letter-spacing:-0.01em}
.title span{font-family:var(--mono);font-size:11px;color:var(--muted)}
.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:2px;font-size:13px;min-width:0}
.crumbs button{border:0;background:none;padding:4px 6px;border-radius:6px;cursor:pointer;color:var(--muted)}
.crumbs button:hover{background:var(--surface);color:var(--ink)}
.crumbs button.cur{color:var(--ink);font-weight:600}
.crumbs i{font-style:normal;color:var(--pipe)}
.actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.btn{height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn .dot{width:8px;height:8px;border-radius:50%;background:var(--neg)}

.board{position:relative;flex:1;overflow:hidden;cursor:grab;touch-action:none;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:22px 22px}
.board.dragging{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.world.glide{transition:transform .62s cubic-bezier(.2,.8,.2,1)}
.root{position:relative;width:max-content;padding:120px 160px 220px}

.flow{display:flex;align-items:center;position:relative}
.node{position:relative;flex:none;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:0 1px 0 rgba(17,19,24,.03),0 6px 18px -10px rgba(17,19,24,.18)}
.node>.head{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:12px 14px 10px 14px;cursor:pointer;border-radius:14px}
.node .glyph{flex:none;width:22px;height:22px;display:grid;place-items:center;color:var(--k)}
.node .txt{display:flex;flex-direction:column;min-width:0;flex:1}
.node .name{font-weight:600;font-size:14px;letter-spacing:-0.01em;overflow-wrap:anywhere}
.node .sub{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .foot{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;padding:0 14px 12px 46px}
.node .sbar{height:4px;border-radius:2px;background:var(--k);opacity:.55}
.node .shape{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.node .flagdot{width:7px;height:7px;border-radius:50%;background:var(--neg);flex:none}
.node.closed{width:auto;min-width:216px;max-width:340px}
.node.closed.t-op{min-width:196px}
.node.closed.t-add{min-width:196px;border-radius:999px}
.node.closed.t-add>.head{border-radius:999px;padding-bottom:12px}
.node.closed.t-add .foot{display:none}
.node.t-repeat.closed{box-shadow:5px 5px 0 -1px var(--surface),5px 5px 0 0 var(--line),10px 10px 0 -1px var(--surface),10px 10px 0 0 var(--line),0 6px 18px -10px rgba(17,19,24,.18)}
.node.closed:hover{border-color:color-mix(in srgb,var(--k) 55%,var(--line))}
.node.open{border-color:color-mix(in srgb,var(--k) 45%,var(--line));background:color-mix(in srgb,var(--k) 3.5%,var(--surface));box-shadow:0 1px 0 rgba(17,19,24,.03),0 18px 40px -24px rgba(17,19,24,.28)}
.node.open>.head{padding:16px 18px 6px 18px}
.node.open .name{font-size:17px}
.node.open .sub{font-size:12px}
.node.ch-added{outline:2px solid var(--good);outline-offset:4px}
.node.ch-changed{outline:2px dashed var(--neg);outline-offset:4px}
.rchip{font:inherit;font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:2px 7px;white-space:nowrap}
button.rchip{cursor:pointer}
button.rchip:hover{border-color:var(--pos);color:var(--pos)}
.refs{display:flex;flex-wrap:wrap;gap:5px}
.tchip{font:inherit;font-family:var(--mono);font-size:10.5px;border:1px solid color-mix(in srgb,var(--pos) 40%,var(--line));background:none;color:var(--pos);border-radius:999px;padding:1px 8px;cursor:pointer;white-space:nowrap}
.tchip:hover{background:color-mix(in srgb,var(--pos) 10%,transparent)}
.tchip.study,.rchip.study{border-style:dashed}
.start{flex:none;width:250px;padding:12px 14px;border:1.5px dashed color-mix(in srgb,var(--pos) 45%,var(--line));border-radius:14px;background:color-mix(in srgb,var(--pos) 5%,var(--surface));display:flex;flex-direction:column;gap:8px}
.start .slab{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--pos)}
.start p{margin:0;font-size:13px;line-height:1.45}
.pop .fsec{margin-top:6px}
.body{padding:0 18px 18px;display:flex;flex-direction:column;gap:16px}
.what{margin:0;color:var(--muted);max-width:60ch}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;align-items:center}
.facts span{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.facts code{font-family:var(--mono);font-size:11.5px;color:var(--ink);background:color-mix(in srgb,var(--ink) 6%,transparent);padding:2px 7px;border-radius:6px;white-space:nowrap}
.flags{display:flex;flex-direction:column;gap:6px;max-width:70ch}
.flags p{margin:0;padding:8px 12px;border-radius:8px;font-size:13px;background:color-mix(in srgb,var(--neg) 10%,transparent);border-left:3px solid var(--neg)}
.flags p.info{background:color-mix(in srgb,var(--pos) 8%,transparent);border-left-color:var(--pos)}
.inner{padding:22px 10px 8px;border-radius:12px;background:color-mix(in srgb,var(--bg) 60%,transparent);border:1px dashed color-mix(in srgb,var(--k) 25%,var(--line))}
.sec{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 -8px}

.orsep{flex:none;width:72px;align-self:stretch;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.orsep span{padding:4px 9px;border:1px dashed var(--line);border-radius:999px;background:var(--surface)}
.pipe{flex:none;width:104px;position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:18px}
.tube{position:relative;width:76px;height:var(--t);border-radius:99px;background:var(--pipe)}
.tube::after{content:"";position:absolute;right:-7px;top:50%;transform:translateY(-50%);border-left:8px solid var(--pipe);border-top:6px solid transparent;border-bottom:6px solid transparent}
.tube i{position:absolute;top:50%;left:0;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--k);opacity:0;animation:flow 2.1s linear infinite}
.tube i:nth-child(2){animation-delay:.7s}.tube i:nth-child(3){animation-delay:1.4s}
@keyframes flow{0%{transform:translateX(0);opacity:0}15%{opacity:.9}85%{opacity:.9}100%{transform:translateX(70px);opacity:0}}
.plabel{font-family:var(--mono);font-size:10.5px;color:var(--muted);white-space:nowrap;max-width:104px;overflow:hidden;text-overflow:ellipsis}
.loop{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;transition:opacity .3s}
.loop path{fill:none;stroke:var(--good);stroke-width:2;stroke-dasharray:5 6;opacity:.7}
.loop text{fill:var(--good);font-family:var(--mono);font-size:12px}
.loop .hd{fill:var(--good);stroke:none;opacity:.8}

.viz{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;max-width:820px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.panel h4{margin:0;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.panel p.note{margin:0;font-size:12px;color:var(--muted)}
.panel svg{display:block;width:100%;height:auto;overflow:visible}
.kv{display:flex;flex-direction:column;gap:6px}
.kv div{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:6px;font-size:13px}
.kv div:last-child{border-bottom:0;padding-bottom:0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-family:var(--mono);font-size:12.5px;text-align:right;overflow-wrap:anywhere}
.big{font-family:var(--mono);font-size:34px;font-weight:500;letter-spacing:-0.02em;line-height:1.1}
.chips{display:flex;flex-direction:column;gap:6px;overflow-x:auto}
.crow{display:flex;gap:4px;align-items:center}
.crow .lbl{width:52px;flex:none;font-size:11px;color:var(--muted)}
.chip{flex:none;min-width:58px;display:flex;flex-direction:column;align-items:center;padding:4px 6px;border-radius:6px;background:color-mix(in srgb,var(--pos) 9%,transparent)}
.chip b{font-family:var(--mono);font-weight:500;font-size:11.5px}
.chip small{font-family:var(--mono);font-size:10px;color:var(--muted);white-space:pre}
.chip.gap{background:none}
.v-pos{fill:var(--pos)} .v-neg{fill:var(--neg)} .v-good{fill:var(--good)} .v-muted{fill:var(--pipe)} .v-mask{fill:var(--mask)}
.v-axis{stroke:var(--line);stroke-width:1} .v-lbl{fill:var(--muted);font-family:var(--mono);font-size:10px} .v-ink{fill:var(--ink);font-family:var(--mono);font-size:10px} .v-on{fill:var(--surface);font-family:var(--mono);font-size:10px} .v-line{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:3 3}

.tip{position:fixed;z-index:50;width:320px;max-width:calc(100vw - 24px);background:var(--tip-bg);color:var(--tip-fg);border-radius:12px;padding:12px 14px;font-size:12.5px;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .14s,transform .14s;box-shadow:0 16px 40px -16px rgba(0,0,0,.5)}
.tip.on{opacity:1;transform:none}
.tip h5{margin:0 0 2px;font-size:14px;font-weight:600}
.tip p{margin:0 0 10px;color:var(--tip-muted)}
.tip dl{display:grid;grid-template-columns:62px minmax(0,1fr);gap:5px 10px;margin:0}
.tip dt{color:var(--tip-muted)}
.tip dd{margin:0;font-family:var(--mono);font-size:11.5px;overflow-wrap:anywhere}
.tip .hint{margin:10px 0 0;padding-top:8px;border-top:1px solid color-mix(in srgb,var(--tip-fg) 18%,transparent);color:var(--tip-fg);font-size:12px}
.pop{position:fixed;z-index:60;width:340px;max-width:calc(100vw - 24px);max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 18px 44px -18px rgba(17,19,24,.35);display:flex;flex-direction:column;gap:2px}
.pop h6{margin:4px 8px 6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pop .fi{display:grid;grid-template-columns:18px minmax(0,1fr);gap:2px 10px;padding:8px;border-radius:8px;border:0;background:none;text-align:left;width:100%}
.pop button.fi{cursor:pointer}
.pop .fi:hover{background:var(--bg)}
.pop .fi b{font-family:var(--mono);font-weight:500;font-size:12.5px;overflow-wrap:anywhere}
.pop .fi span{font-size:12px;color:var(--muted)}
.pop .tag{display:inline-block;width:10px;height:10px;border-radius:50%;margin-top:4px;grid-row:span 2}

.legend{position:absolute;left:16px;bottom:16px;z-index:10;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:12px;max-width:min(300px,calc(100% - 32px))}
.legend{transition:opacity .25s,transform .25s}
.legend.away{opacity:0;transform:translateY(8px);pointer-events:none}
.legend .row{display:flex;align-items:center;gap:8px;color:var(--muted)}
.legend .row svg{flex:none}
.legend .pipes{display:flex;flex-direction:column;gap:5px;padding-top:6px;border-top:1px solid var(--line)}
.legend .pipes div{display:flex;align-items:center;gap:8px;color:var(--muted);font-family:var(--mono);font-size:10.5px}
.legend .pipes span.t{width:40px;border-radius:99px;background:var(--pipe)}
.legend .hide{position:absolute;top:6px;right:6px;width:26px;height:26px;border:0;background:none;border-radius:6px;cursor:pointer;color:var(--muted)}
.zoom{position:absolute;right:16px;bottom:16px;z-index:10;display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.zoom button{width:34px;height:34px;border:0;background:none;border-radius:8px;cursor:pointer;font-size:16px}
.zoom button:hover{background:var(--bg)}
.zoom output{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:44px;text-align:center}
.hint0{position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:10;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:12.5px;color:var(--muted);transition:opacity .4s;white-space:nowrap}
@media (max-width:640px){.legend{display:none}.hint0{font-size:11.5px}}
@media (prefers-reduced-motion: reduce){.tube i{animation:none;opacity:.6;left:35px}.world.glide{transition:none}}

/* Subway front door: every flow is one coloured line, its top-level steps are stations, a step that starts another flow is a transfer */
:root{ --ln-0:#2F55C9; --ln-1:#0B8A74; --ln-2:#C2620F; --ln-3:#8443C2; --ln-4:#C2367A; --ln-5:#7A6A12; --ln-6:#596273; --ln-7:#1F6F99; --pill-ink:#FFFFFF; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ln-0:#7C9BFF; --ln-1:#40CCB0; --ln-2:#F0A25A; --ln-3:#C79BFF; --ln-4:#FF8FC0; --ln-5:#D9C25A; --ln-6:#A6ADBA; --ln-7:#6CC3EE; --pill-ink:#0D0F13; } }
:root[data-theme="dark"]{ --ln-0:#7C9BFF; --ln-1:#40CCB0; --ln-2:#F0A25A; --ln-3:#C79BFF; --ln-4:#FF8FC0; --ln-5:#D9C25A; --ln-6:#A6ADBA; --ln-7:#6CC3EE; --pill-ink:#0D0F13; }
.subway{position:relative;flex:1;min-height:0;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:22px 22px}
.subway svg{display:block;width:100%;height:100%}
.sw-line{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.sw-line.study{stroke-width:6;stroke-dasharray:1 10}
.sw-st.study .dot{stroke-width:3}
.sw-pill.study rect{fill:var(--bg)!important;stroke-width:2;stroke-dasharray:4 3}
.sw-pill.study text{fill:var(--ink)}
.sw-link{fill:none;stroke-width:3;stroke-dasharray:2 7;stroke-linecap:round}
.sw-st{cursor:pointer;outline:none}
.sw-st .dot{fill:var(--surface);stroke-width:4}
.sw-st .xfer{fill:var(--surface);stroke:var(--ink);stroke-width:4}
.sw-st .halo{fill:transparent;stroke:none}
.sw-st:hover .dot,.sw-st:focus-visible .dot,.sw-st:hover .xfer,.sw-st:focus-visible .xfer{stroke-width:6}
.sw-st:focus-visible .halo{stroke:var(--pos);stroke-width:2;stroke-dasharray:3 3}
.sw-st:hover .sw-lbl,.sw-st:focus-visible .sw-lbl{fill:var(--pos)}
.sw-lbl{font-family:var(--sans);font-size:12.5px;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.sw-cap{font-family:var(--mono);font-size:10.5px;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.sw-muted{fill:var(--muted)}
.sw-flag{fill:var(--neg);stroke:var(--surface);stroke-width:2}
.sw-pill{cursor:pointer;outline:none}
.sw-pill rect{stroke:none}
.sw-pill text{font-family:var(--sans);font-size:13px;font-weight:600;fill:var(--pill-ink)}
.sw-pill:hover rect,.sw-pill:focus-visible rect{stroke:var(--ink);stroke-width:2}
.sw-pill.study:hover rect,.sw-pill.study:focus-visible rect{stroke-dasharray:none;stroke-width:3}
.sw-legend{font-family:var(--sans);font-size:12px;fill:var(--muted)}
</style>

  var host = {}; links.forEach(function(l){ if (l.to === main.id) host[l.from] = true; });
  var L = {}; // flow id -> { lane, kind: main | branch | row | host, xs: [], from: link }
  var stepIx = {}; FLOWS.forEach(function(f){ (f.steps || []).forEach(function(s, i){ stepIx[s.id] = i; }); });
  var mdx = Math.max(120, Math.min(190, (W * 0.58 - X0) / Math.max(1, main.steps.length - 1)));
  // First-level branches: lines the main flow starts, each from the earliest station that starts it.
  var first = [];
  FLOWS.slice(1).forEach(function(f){
    if (host[f.id]) return;
    var from = links.filter(function(l){ return l.from === main.id && l.to === f.id; }).sort(function(a, b){ return stepIx[a.station] - stepIx[b.station]; })[0];
    if (from) first.push({ f: f, link: from });
  });
  first.sort(function(a, b){ return stepIx[a.link.station] - stepIx[b.link.station] || LINE_IX[a.f.id] - LINE_IX[b.f.id]; });
  // Study lines (explanations of a station) go above and the lines that run go below, so the two kinds never mix.
  // Without study lines, a line that starts further lines goes below, so they can sit right under it; the rest go above.
  var feeds = function(fid){ return links.some(function(l){ return l.from === fid && l.to !== main.id && !host[l.to] && !first.some(function(x){ return x.f.id === l.to; }); }); };
  var up, down;
  if (first.some(function(b){ return b.f.study; })){ up = first.filter(function(b){ return b.f.study; }); down = first.filter(function(b){ return !b.f.study; }); }
  else { up = first.filter(function(b){ return !feeds(b.f.id); }); down = first.filter(function(b){ return feeds(b.f.id); }); if (!down.length && up.length > 2) down.push(up.pop()); }
  // A branch fits when its stations get 112 units each, or at least 96 when every station name still wraps into
  // three lines at that spacing (the same wrap the stations are drawn with).
  var labelsFit = function(f, dx){ var max = Math.max(12, Math.min(24, Math.floor((dx - 14) / 6.7))); return (f.steps || []).every(function(s){ var w = wrapText(s.name, max, 9); return w.length <= 3 && w.every(function(l){ return l.length <= max; }); }); };
  // Branches that leave one station on the same side fan out: the innermost runs straight off at 45°, and each
  // one further out first drops straight down (or up) by the lanes between them, then runs parallel to it.
  var fit = function(b, xsMain, side){
    var inner = Math.min.apply(null, side.filter(function(o){ return o.link.station === b.link.station; }).map(function(o){ return Math.abs(o.lane); }));
    var xs0 = xsMain[stepIx[b.link.station]], drop = Math.abs(b.lane) - inner, jx = xs0 + inner * LG, pill = 30 + b.f.name.length * 7.6, start = jx + pill + 34, n = (b.f.steps || []).length;
    var dx = n > 1 ? Math.min(190, (W - PADR - start) / (n - 1)) : 0;
    if (n > 1 && dx < 112 && !(dx >= 96 && labelsFit(b.f, dx))) return null;
    return { lane: b.lane, kind: 'branch', from: b.link, jx: jx, x0: xs0, drop: drop, pill: pill, xs: (b.f.steps || []).map(function(s, i){ return start + i * dx; }) };
  };
  // The leftmost branch takes the outermost lane, so no branch crosses another. A branch with no room to its right
  // becomes a full row instead, and the branches left close up, until every branch fits. When a branch doesn't fit,
  // the main line's stations close up first (down to 120 apart), and the widest spacing with the fewest rows wins.
  var place = function(md){
    var xs = main.steps.map(function(s, i){ return X0 + i * md; }), u = up.slice(), d = down.slice(), out = [];
    for (var moved = true; moved;){
      moved = false;
      u.forEach(function(b, i){ b.lane = -(u.length - i); }); d.forEach(function(b, i){ b.lane = d.length - i; });
      [u, d].forEach(function(side){ for (var i = side.length - 1; i >= 0; i--){ if (!fit(side[i], xs, side)){ out.unshift({ f: side[i].f, link: side[i].link, side: side[i].lane }); side.splice(i, 1); moved = true; } } });
    }
    return { mdx: md, xs: xs, up: u, down: d, rows: out, fits: u.map(function(b){ return fit(b, xs, u); }).concat(d.map(function(b){ return fit(b, xs, d); })) };
  };
  var best = place(mdx);
  for (var md = Math.floor(mdx) - 1; best.rows.length && md >= 120; md--){ var p = place(md); if (p.rows.length < best.rows.length) best = p; }
  mdx = best.mdx; up = best.up; down = best.down;
  var rows = best.rows;
  L[main.id] = { lane: 0, kind: 'main', xs: best.xs };
  up.concat(down).forEach(function(b, i){ L[b.f.id] = best.fits[i]; });
  var minLane = -up.length, maxLane = down.length;
  // Everything else is a full row: next to the line that starts it, else at the bottom; host lines go on top.
  FLOWS.slice(1).forEach(function(f){
    if (L[f.id] || host[f.id] || rows.some(function(r){ return r.f.id === f.id; })) return;
    var link = links.filter(function(l){ return l.to === f.id && L[l.from] && !host[l.from]; })[0];
    rows.push({ f: f, link: link || null, side: link ? (L[link.from].lane < 0 ? -1 : 1) : 1 });
  });
  rows.forEach(function(r){ r.lane = r.side < 0 ? --minLane : ++maxLane; });
  FLOWS.slice(1).forEach(function(f){ if (host[f.id]) rows.push({ f: f, link: null, lane: --minLane, host: true }); });
  rows.forEach(function(r){
    var n = (r.f.steps || []).length, dx = n > 1 ? Math.min(210, (W - PADR - X0) / (n - 1)) : 0;
    L[r.f.id] = { lane: r.lane, kind: r.host ? 'host' : 'row', from: r.link, xs: (r.f.steps || []).map(function(s, i){ return X0 + i * dx; }) };
  });
  var TOP = 64, y = function(lane){ return TOP + (lane - minLane) * LG; };
  Object.keys(L).forEach(function(fid){ L[fid].y = y(L[fid].lane); });
  return { W: W, H: TOP + (maxLane - minLane) * LG + 92, L: L, links: links, host: host, main: main, X0: X0, LG: LG, mdx: mdx };
}
function renderSubway(){
  var G = layoutSubway(), L = G.L, svg = document.getElementById('subwaySvg'), lines = '', links = '', stations = '', labels = '', pills = '';
  svg.setAttribute('viewBox', '0 0 ' + G.W + ' ' + G.H);
  var ownLinks = function(fid, sid){ return G.links.filter(function(l){ return l.from === fid && l.station === sid; }); };
  var dirs = {}; // station id -> {up, down}: where branches leave it, so its label can step aside
  Object.keys(L).forEach(function(fid){ var R = L[fid]; if (R.kind === 'branch'){ var d = dirs[R.from.station] = dirs[R.from.station] || {}; d[R.lane < 0 ? 'up' : 'down'] = true; } if (R.kind === 'row' && R.from){ var dd = dirs[R.from.station] = dirs[R.from.station] || {}; dd[R.lane < L[R.from.from].lane ? 'up' : 'down'] = true; } });
  function pill(fid, x, y, anchor){
    var f = flowById(fid), w = 30 + f.name.length * 7.6, x0 = anchor === 'end' ? x - w : x;
    return '<g class="sw-pill' + (f.study ? ' study' : '') + '" tabindex="0" role="button" data-line="' + esc(fid) + '" aria-label="Open the ' + esc(f.name) + (f.study ? ' study line' : ' flow') + '"><rect x="' + x0 + '" y="' + (y - 14) + '" width="' + w + '" height="28" rx="14" style="fill:' + lineColor(fid) + (f.study ? ';stroke:' + lineColor(fid) : '') + '"/><text x="' + (x0 + w / 2) + '" y="' + (y + 4.5) + '" text-anchor="middle">' + esc(f.name) + '</text></g>';
  }
  FLOWS.forEach(function(f){
    var R = L[f.id]; if (!R || !R.xs.length) return;
    var c = lineColor(f.id), last = R.xs[R.xs.length - 1], d;
    if (R.kind === 'branch'){
      var y0 = L[R.from.from].y;
      var ydrop = y0 + (R.lane < 0 ? -1 : 1) * R.drop * G.LG;
      d = 'M' + R.x0 + ' ' + y0 + (R.drop ? ' L' + R.x0 + ' ' + ydrop : '') + ' L' + R.jx + ' ' + R.y + ' L' + last + ' ' + R.y;
      pills += pill(f.id, R.jx + 16, R.y);
      // Every reason this line starts, wrapped; a branch below the main line has room for two lines.
      var room = R.lane > 0 ? 2 : 3, whens = R.from.whens.slice(0, room);
      var when = whens.map(function(w){ return wrapText(w, 46, Math.max(1, room - whens.length + 1)); }).reduce(function(a, b){ return a.concat(b); }, []).slice(0, room);
      if (when.length) labels += svgLines(R.jx + 16, R.y - 24, when, 'sw-cap', 'start', 13, true).replace('class="sw-cap"', 'class="sw-cap" style="fill:' + c + '"');
    } else {
      d = 'M' + R.xs[0] + ' ' + R.y + ' L' + last + ' ' + R.y;
      pills += pill(f.id, R.xs[0] - 30, R.y, 'end');
      var cap = R.kind === 'main' ? 'the main flow' : (R.kind === 'host' ? 'starts the hosts the other lines run in' : (f.trigger || ''));
      labels += svgLines(R.xs[0] - 30, R.y - 24, wrapText(cap, 26, 3), 'sw-cap sw-muted', 'end', 13, true);
      if (R.kind === 'row' && R.from){
        // A dashed passage from the station that feeds this line to its first station.
        var src = L[R.from.from], sx = src.xs[(flowById(R.from.from).steps || []).map(function(s){ return s.id; }).indexOf(R.from.station)];
        var dir = R.y > src.y ? 1 : -1, ym = R.y - dir * 36, fx = R.xs[0];
        links += '<path class="sw-link" style="stroke:' + c + '" d="M' + sx + ' ' + (src.y + dir * 12) + ' L' + sx + ' ' + ym + ' L' + fx + ' ' + ym + ' L' + fx + ' ' + (R.y - dir * 13) + '"/>';
        var wl = R.from.whens.map(function(w){ return clip(w, 90); }).slice(0, 2);
        if (wl.length) labels += svgLines(fx + 26, ym + (dir > 0 ? -8 : 17), ['↳ from ' + flowName(R.from.from) + ': ' + wl[0]].concat(wl.slice(1)), 'sw-cap', 'start', 13, dir > 0).replace('class="sw-cap"', 'class="sw-cap" style="fill:' + c + '"');
      }
    }
    lines += '<path class="sw-line' + (f.study ? ' study' : '') + '" style="stroke:' + c + '" d="' + d + '"/>';
  });
  FLOWS.forEach(function(f){
    var R = L[f.id]; if (!R) return;
    var spacing = R.xs.length > 1 ? R.xs[1] - R.xs[0] : 180, max = Math.max(12, Math.min(24, Math.floor((spacing - 14) / 6.7)));
    (f.steps || []).forEach(function(s, i){
      var x = R.xs[i], yy = R.y, out = ownLinks(f.id, s.id), xfer = out.length > 0, dir = dirs[s.id] || {}, warns = warnCount(s);
      var label = wrapText(s.name, max, 3), lbl, half = Math.max.apply(null, label.map(function(l){ return l.length; })) * 3.4;
      // Labels step aside from branches leaving the station, and the rightmost ones hug the edge instead of spilling over it.
      var ax = x, anchor = 'middle';
      if (x + half > G.W - 8){ ax = x + 12; anchor = 'end'; label = wrapText(s.name, Math.min(max, 11), 3); }
      if (dir.up && dir.down) lbl = svgLines(x - 16, yy - 22, label, 'sw-lbl', 'end', 15, true);
      else if (dir.down) lbl = svgLines(ax, yy - 24, label, 'sw-lbl', anchor, 15, true);
      else lbl = svgLines(ax, yy + 30, label, 'sw-lbl', anchor, 15);
      var runs = out.filter(function(l){ return !isStudy(l.to); }).map(function(l){ return flowName(l.to); }), studied = out.filter(function(l){ return isStudy(l.to); }).map(function(l){ return flowName(l.to); });
      var starts = (runs.length ? ['starts ' + runs.join(', ')] : []).concat(studied.length ? ['explained in ' + studied.join(', ')] : []);
      var g = '<g class="sw-st' + (f.study ? ' study' : '') + '" tabindex="0" role="button" data-flow="' + esc(f.id) + '" data-step="' + esc(s.id) + '" aria-label="' + esc(s.name + ' (' + f.name + ')' + (starts.length ? ', ' + starts.join(', ') : '')) + '">';
      g += '<circle class="halo" cx="' + x + '" cy="' + yy + '" r="17"/>';
      g += xfer ? '<circle class="xfer" cx="' + x + '" cy="' + yy + '" r="10.5"/>' : '<circle class="dot" cx="' + x + '" cy="' + yy + '" r="7.5" style="stroke:' + lineColor(f.id) + '"/>';
      if (warns) g += '<circle class="sw-flag" cx="' + (x + 10) + '" cy="' + (yy - 10) + '" r="4.5"><title>' + warns + ' flagged problem' + (warns > 1 ? 's' : '') + ' inside</title></circle>';
      if (R.kind === 'host' && out.length){
        out.forEach(function(l, k){ g += '<circle cx="' + (x - (out.length - 1) * 7 + k * 14) + '" cy="' + (yy - 24) + '" r="5" style="fill:' + lineColor(l.to) + '"><title>starts ' + esc(flowName(l.to)) + '</title></circle>'; });
      }
      stations += g + lbl + '</g>';
    });
  });
  var legend = '<text class="sw-legend" x="' + (G.W - 24) + '" y="' + (G.H - 18) + '" text-anchor="end">Each line is a flow and each station one of its top-level steps · a ringed station starts another line' + (FLOWS.some(function(f){ return f.study; }) ? ' · a dotted line is a study line that explains a station' : '') + ' · an orange dot marks a flagged problem inside · click a station to open it, a line name to open its flow</text>';
  svg.innerHTML = lines + links + stations + labels + pills + legend;
}
document.getElementById('subwaySvg').addEventListener('click', function(e){
  var st = e.target.closest('.sw-st'), pl = e.target.closest('.sw-pill');
  hideTip();
  if (st) goFlow(st.dataset.flow, { open: st.dataset.step });
  else if (pl) goFlow(pl.dataset.line);
});
document.getElementById('subwaySvg').addEventListener('keydown', function(e){
  if (e.key !== 'Enter' && e.key !== ' ') return;
  var t = e.target.closest('.sw-st, .sw-pill'); if (!t) return;
  e.preventDefault(); t.dispatchEvent(new MouseEvent('click', { bubbles: true }));
});
function subwayTip(e){
  var st = e.target.closest('.sw-st'); if (!st){ hideTip(); return; }
  var n = BY[st.dataset.step]; if (!n) return;
  var starts = subwayLinks().filter(function(l){ return l.from === st.dataset.flow && l.station === n.id; });
  clearTimeout(tipTimer);
  tip.innerHTML = '<h5>' + esc(n.name) + '</h5>' + (n.what ? '<p>' + esc(n.what) + '</p>' : '') + '<dl>' + (n.in ? '<dt>In</dt><dd>' + esc(n.in) + '</dd>' : '') + (n.out ? '<dt>Out</dt><dd>' + esc(n.out) + '</dd>' : '') +
    starts.map(function(l){ return '<dt>' + (isStudy(l.to) ? 'Study' : 'Starts') + '</dt><dd>' + esc(flowName(l.to)) + (l.whens.length ? ' · ' + esc(l.whens.join('; ')) : '') + '</dd>'; }).join('') + '</dl>' +
    '<p class="hint">' + esc(flowName(st.dataset.flow)) + ' · click to open' + (n.children ? ' · ' + n.children.length + ' steps inside' : '') + '</p>';
  var r = st.querySelector('circle.halo').getBoundingClientRect(), tw = Math.min(320, window.innerWidth - 24);
  tip.style.left = Math.min(Math.max(12, r.left - 20), window.innerWidth - tw - 12) + 'px'; tip.style.top = (r.bottom + 8) + 'px';
  tip.classList.add('on');
  var th = tip.offsetHeight; if (r.bottom + 8 + th > window.innerHeight - 12) tip.style.top = Math.max(12, r.top - th - 8) + 'px';
}
document.getElementById('subwaySvg').addEventListener('pointerover', function(e){ if (e.pointerType !== 'touch') subwayTip(e); });
document.getElementById('subwaySvg').addEventListener('pointerleave', hideTip);
document.getElementById('subwaySvg').addEventListener('focusin', subwayTip);
document.getElementById('subwaySvg').addEventListener('focusout', hideTip);

booting = false;

if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ if (VIEW !== 'subway'){ drawLoops(); focusOn(focusId); } });
