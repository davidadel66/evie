<!doctype html>
<html lang="en" data-theme="dusk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>evie</title>
    <!-- An empty icon until evie's own is drawn. A page that names none makes
         every browser ask for /favicon.ico, a 404 and a console error each load. -->
    <link rel="icon" href="data:," />
    <script>
      // The theme this browser picked, set before the page is first drawn,
      // so that it does not open in Dusk for a moment. theme.ts keeps it.
      try {
        const theme = localStorage.getItem("evie.theme")
        if (theme === "moss" || theme === "oxblood") document.documentElement.dataset.theme = theme
      } catch {}
    </script>
    <link rel="stylesheet" href="./src/fonts.css" />
    <link rel="stylesheet" href="./src/styles.css" />
    <script type="module" src="./src/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
