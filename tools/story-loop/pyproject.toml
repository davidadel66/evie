[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evie-story-loop"
version = "0.1.0"
description = "Auditable Codex implementation-review-repair controller for Evie stories"
requires-python = ">=3.10"
dependencies = [
  "openai-codex==0.147.0",
]

[project.scripts]
evie-story-loop = "story_loop.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/story_loop"]
